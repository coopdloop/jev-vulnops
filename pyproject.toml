[project]
name = "jev-vulnops"
version = "0.1.0"
description = "Demo: vulnerability triage decisions with TypeSafe's System One model (Jev)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["typesafe-sdk"]
test = ["pytest>=8"]

[project.scripts]
jev-vulnops = "jev_vulnops.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_vulnops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
